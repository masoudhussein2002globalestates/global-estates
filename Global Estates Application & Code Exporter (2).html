          // Bedrooms filter

          // Guests filter
          if (minGuests !== 'Any' && p.maxGuests < parseInt(minGuests)) return false;

            const q = searchQuery.toLowerCase();
            const matchTitle = p.title.toLowerCase().includes(q);
            const matchLoc = p.location.toLowerCase().includes(q);
            const matchCountry = p.country.toLowerCase().includes(q);
            if (!matchTitle && !matchLoc && !matchCountry) return false;
          }
          return true;
        });

      const [country, setCountry] = useState('Kenya');
      const [price, setPrice] = useState('');
      const [currency, setCurrency] = useState('KSh');
      const [period, setPeriod] = useState('month');
      const [bedrooms, setBedrooms] = useState(2);
      const [bathrooms, setBathrooms] = useState(2);
      const [maxGuests, setMaxGuests] = useState(4);
      const [sizeSqFt, setSizeSqFt] = useState(1500);
      const [tier, setTier] = useState('Featured'); // Free, Featured, Premium
      const [imageUrl, setImageUrl] = useState('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1000&q=80');
      const [description, setDescription] = useState('');

      // AI Generator Panel States
      const [isAiGenerating, setIsAiGenerating] = useState(false);
      const [aiLength, setAiLength] = useState('Standard');
      const [aiTone, setAiTone] = useState('Luxury');
      const [aiLang, setAiLang] = useState('English');

      const handleGenerateAiDescription = async () => {
        if (!title || !location) {
          showToast('Please fill in Property Title & Location first!');
          return;
        }

        setIsAiGenerating(true);
        try {
          const prompt = `Write a ${aiTone.toLowerCase()} real estate listing description for a property named "${title}" located in ${location}, ${country}. Category is ${category}. Specs: ${bedrooms} beds, ${bathrooms} baths, ${sizeSqFt} sq ft. Target length: ${aiLength}. Write in ${aiLang} language. Make it compelling for high-value renters or buyers.`;
          
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              systemInstruction: {
                parts: [{ text: "You are a professional luxury real estate copywriter. Output ONLY the polished listing description text directly without introduction or meta commentary." }]
              }
            })
          });

          // 4. database/schema.sql
          zip.file('database/schema.sql', `-- Global Estates Database Schema
CREATE TABLE IF NOT EXISTS users (
  id SERIAL PRIMARY KEY,
  name VARCHAR(255) NOT NULL,
  email VARCHAR(255) UNIQUE NOT NULL,
  phone VARCHAR(50),

);
`);

          // 5. Render & Docker deployment files
          zip.file('render.yaml', `services:\n  - type: web\n    name: global-estates\n    env: node\n    buildCommand: npm install && npm run build\n    startCommand: npm start\n`);
          zip.file('Dockerfile', `FROM node:20-alpine\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nCOPY . .\nEXPOSE 5000\nCMD ["npm", "start"]\n`);
